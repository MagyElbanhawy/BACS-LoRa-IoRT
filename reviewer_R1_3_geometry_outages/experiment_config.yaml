# Experiment Configuration for Reviewer 1.3: Geometry-Dependent Radio Outages
# BACS / BACS+ Evaluation on Pristine Seed Block 130-159

experiment:
  name: "reviewer_R1_3_geometry_outages"
  description: "Evaluation of BACS/BACS+ under physical obstacle blockage (C4) and matched-rate independent loss (C4-IID)"
  seed_range: [130, 159]
  n_seeds: 30
  team_sizes: [2, 3, 4, 5]
  policies:
    - "fifo"
    - "random"
    - "lifo"
    - "bacs_gated"
    - "bacs_plus"

arena:
  dimensions: [14.0, 10.5]  # [width_m, height_m]
  server_position: [7.0, 10.5]  # [x_m, y_m] northern ceiling
  obstacles:
    - name: "Rack_North_West"
      bounds: [1.5, 4.5, 6.5, 8.0]
    - name: "Rack_North_Center"
      bounds: [5.5, 8.5, 6.5, 8.0]
    - name: "Rack_North_East"
      bounds: [9.5, 12.5, 6.5, 8.0]
    - name: "Rack_South_West"
      bounds: [1.5, 4.5, 2.5, 4.0]
    - name: "Rack_South_Center"
      bounds: [5.5, 8.5, 2.5, 4.0]
    - name: "Rack_South_East"
      bounds: [9.5, 12.5, 2.5, 4.0]

channel_models:
  C4_geometry:
    p_delivery_los: 0.95
    p_delivery_nlos: 0.10
    max_retries: 3
    ack_timeout_s: 0.5
    extra_delay_s: 0.0
  C4_IID_matched:
    p_drop_matched: 0.2615  # Exactly matches trajectory average of C4
    max_retries: 3
    ack_timeout_s: 0.5
    extra_delay_s: 0.0
  C0_baseline:
    p_drop: 0.0
    max_retries: 3
    ack_timeout_s: 0.5

radio:
  spreading_factor: 7
  bandwidth_hz: 125000
  coding_rate: 1  # 4/5
  preamble_symbols: 8
  payload_bytes: 52
  duty_cycle: 0.01

session:
  duration_s: 600.0
  window_s: 60.0
  dt_s: 0.1
  fusion_every_windows: 1
